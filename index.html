<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sompurna Beauty ON Call - Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-3">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-pink-100 flex flex-col h-[85vh] overflow-hidden">
    
    <!-- Header -->
    <div class="bg-pink-600 text-white px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-base">Sompurna Beauty ON Call</h1>
        <p class="text-xs text-pink-100">সৌন্দর্যের যত্ন, এবার আপনার ঘরেই</p>
      </div>
      <span class="text-xs bg-pink-500 px-2.5 py-1 rounded-full">Online</span>
    </div>

    <!-- Quick Buttons -->
    <div class="px-3 py-2 bg-pink-50/60 border-b border-pink-100 flex gap-2 overflow-x-auto text-xs">
      <button type="button" onclick="sendQuickText('সার্ভিস ও রেট চার্ট জানতে চাই')" class="bg-white border border-pink-200 text-pink-700 px-3 py-1 rounded-full whitespace-nowrap hover:bg-pink-100">
        রেট চার্ট
      </button>
      <button type="button" onclick="sendQuickText('আমি একটি সার্ভিস বুক করতে চাই')" class="bg-white border border-pink-200 text-pink-700 px-3 py-1 rounded-full whitespace-nowrap hover:bg-pink-100">
        বুকিং করুন
      </button>
    </div>

    <!-- Chat Messages -->
    <div id="chatBox" class="flex-1 p-4 space-y-3 overflow-y-auto">
      <div class="flex items-start gap-2.5">
        <div class="w-8 h-8 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
        <div class="bg-pink-50 border border-pink-100 text-gray-800 rounded-2xl rounded-tl-none px-4 py-2.5 text-sm shadow-sm max-w-[85%]">
          নমস্কার! <b>Sompurna Beauty ON Call</b>-এ আপনাকে স্বাগতম। আমি আপনাকে কীভাবে সাহায্য করতে পারি?
        </div>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div id="typingIndicator" class="hidden px-4 pb-1 text-xs text-pink-600">
      অ্যাসিস্ট্যান্ট লিখছেন...
    </div>

    <!-- Input Box -->
    <form id="chatForm" class="p-3 border-t border-gray-100 flex gap-2 bg-white">
      <input
        id="userInput"
        type="text"
        placeholder="এখানে মেসেজ লিখুন..."
        class="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-pink-500"
        required
      />
      <button
        type="submit"
        class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-full text-sm font-medium transition"
      >
        পাঠান
      </button>
    </form>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlZv5xAQf_GLn8z_4zJGtmYvQRPKvL9Qy9gl3z-HZMoDg_zwgt5uBfp8S1AKfnGlLg/exec";

    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const typingIndicator = document.getElementById("typingIndicator");

    let conversationHistory = [];

    function appendMessage(sender, text) {
      const wrapper = document.createElement("div");
      wrapper.className = sender === "user" ? "flex justify-end" : "flex items-start gap-2.5";
      const formattedText = text.replace(/\n/g, "<br>").replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");

      if (sender === "user") {
        wrapper.innerHTML = `<div class="bg-pink-600 text-white rounded-2xl rounded-tr-none px-4 py-2.5 text-sm shadow-sm max-w-[80%]">${formattedText}</div>`;
      } else {
        wrapper.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center font-bold text-sm shrink-0">AI</div>
          <div class="bg-pink-50 border border-pink-100 text-gray-800 rounded-2xl rounded-tl-none px-4 py-2.5 text-sm shadow-sm max-w-[85%]">${formattedText}</div>
        `;
      }
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendQuickText(text) {
      userInput.value = text;
      chatForm.dispatchEvent(new Event("submit"));
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";
      typingIndicator.classList.remove("hidden");

      conversationHistory.push({ role: "user", parts: [{ text: text }] });

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ history: conversationHistory })
        });
        const data = await res.json();

        if (data.history && data.history.length > 0) {
          conversationHistory = data.history;
        }
        appendMessage("ai", data.reply);
      } catch (error) {
        console.error(error);
        appendMessage("ai", "দুঃখিত, সংযোগে সমস্যা হচ্ছে। অনুগ্রহ করে একটু পর আবার চেষ্টা করুন।");
      } finally {
        typingIndicator.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
